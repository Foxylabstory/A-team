  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

а · Набережные Челны<\u002Fspan>\n      <\u002Fdiv>\n      <h1 style=\"margin:0; font-family:'Oswald',sans-serif; font-weight:700; font-size:clamp(44px,7.5vw,92px); line-height:0.92; letter-spacing:-0.01em; text-transform:uppercase; color:#fff; text-wrap:balance\">Здесь<br>формируют<br><span style=\"background:linear-gradient(180deg,#ffffff 0%,#9ea3ab 100%); -webkit-background-clip:text; background-clip:text; color:transparent\">характер<\u002Fspan><\u002Fh1>\n      <p style=\"margin:0; font-size:19px; line-height:1.55; color:#b1b5bc; max-width:540px\">Вольная борьба, джиу-джитсу, ММА, бокс, кикбоксинг и боевое самбо. Тренируем детей с 3,5 лет и взрослых любого уровня.<\u002Fp>\n      <div style=\"display:flex; align-items:center; gap:16px; flex-wrap:wrap\">\n        <a href=\"#contacts\" style=\"padding:18px 34px; font-family:'Oswald',sans-serif; font-size:15px; letter-spacing:0.16em; text-transform:uppercase; color:#0a0a0b; background:linear-gradient(180deg,#f2f3f5,#b9bdc4)\" style-hover=\"background:#fff\">Записаться на тренировку<\u002Fa>\n        <a href=\"#directions\" style=\"padding:18px 30px; font-family:'Oswald',sans-serif; font-size:15px; letter-spacing:0.16em; text-transform:uppercase; color:#e8e8ea; border:1px solid rgba(255,255,255,0.22)\" style-hover=\"border-color:#b9bdc4; color:#fff\">Направления<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(3,max-content); gap:44px; padding-top:14px\">\n        <div style=\"display:flex; flex-direction:column; gap:6px\"><span style=\"font-family:'Oswald',sans-serif; font-size:38px; color:#fff\">3,5+<\u002Fspan><span style=\"font-size:12px; letter-spacing:0.18em; text-transform:uppercase; color:#8d9199\">возраст, лет<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:6px\"><span style=\"font-family:'Oswald',sans-serif; font-size:38px; color:#fff\">6<\u002Fspan><span style=\"font-size:12px; letter-spacing:0.18em; text-transform:uppercase; color:#8d9199\">направлений<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:6px\"><span style=\"font-family:'Oswald',sans-serif; font-size:38px; color:#fff\">7/7<\u002Fspan><span style=\"font-size:12px; letter-spacing:0.18em; text-transform:uppercase; color:#8d9199\">дней в неделю<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position:relative; display:flex; align-items:center; justify-content:center; min-height:520px\">\n      <div style=\"position:absolute; inset:0; background:radial-gradient(circle at 50% 46%, rgba(214,218,224,0.20) 0%, rgba(140,146,156,0.10) 34%, rgba(10,10,11,0) 62%)\"><\u002Fdiv>\n      <div style=\"position:relative; display:flex; flex-direction:column; align-items:center; gap:26px; animation:drift 4s ease-in-out infinite alternate\">\n        <div style=\"position:relative; width:min(78vw,380px); aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; border-radius:50%; background:radial-gradient(circle at 50% 40%, #17181c 0%, #000 70%); box-shadow:0 0 0 1px rgba(255,255,255,0.14), 0 0 60px 8px rgba(190,196,205,0.16), inset 0 1px 0 rgba(255,255,255,0.12)\">\n          <img src=\"b70011d4-4c95-46ff-8555-765bed8ad1b9\" alt=\"ANTIPOV TEAM\" style=\"width:68%; height:68%; object-fit:contain; border-radius:50%; filter:drop-shadow(0 0 18px rgba(210,215,222,0.28))\">\n        <\u002Fdiv>\n        <span style=\"font-size:11px; letter-spacing:0.32em; text-transform:uppercase; color:#8d9199\">Antipov Team · с 2014<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div style=\"display:flex; flex-wrap:wrap; justify-content:center; row-gap:10px; column-gap:28px; align-items:center; padding:18px 40px; border-bottom:1px solid rgba(255,255,255,0.08); font-family:'Oswald',sans-serif; font-size:14px; letter-spacing:0.28em; text-transform:uppercase; color:#7e838b\">\n    <span>Вольная борьба<\u002Fspan><span>•<\u002Fspan><span>Джиу-джитсу<\u002Fspan><span>•<\u002Fspan><span>ММА<\u002Fspan><span>•<\u002Fspan><span>Бокс<\u002Fspan><span>•<\u002Fspan><span>Кикбоксинг<\u002Fspan><span>•<\u002Fspan><span>Боевое самбо<\u002Fspan>\n  <\u002Fdiv>\n\n  <section id=\"directions\" style=\"padding:clamp(56px,7vw,96px) clamp(18px,8vw,182px); border-bottom:1px solid rgba(255,255,255,0.08)\">\n    <div style=\"display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px 32px; margin-bottom:44px\">\n      <h2 style=\"margin:0; font-family:'Oswald',sans-serif; font-size:clamp(34px,5vw,54px); line-height:1; text-transform:uppercase; color:#fff\">Направления<\u002Fh2>\n      <p style=\"margin:0; max-width:380px; font-size:15px; line-height:1.6; color:#9ea3ab\">Группы разделены по возрасту и уровню подготовки — от первых шагов на ковре до соревновательного спорта.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:1px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.1)\">\n      <sc-for list=\"{{ directions }}\" as=\"d\" hint-placeholder-count=\"6\">\n        <article style=\"display:flex; flex-direction:column; gap:14px; padding:34px 30px 38px; background:#0d0e10; min-height:230px\" style-hover=\"background:#15161a\">\n          <span style=\"font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:0.2em; color:#6f747c\">{{ d.num }}<\u002Fspan>\n          <h3 style=\"margin:0; font-family:'Oswald',sans-serif; font-size:28px; text-transform:uppercase; color:#fff\">{{ d.title }}<\u002Fh3>\n          <p style=\"margin:0; font-size:15px; line-height:1.6; color:#9ea3ab\">{{ d.text }}<\u002Fp>\n          <span style=\"margin-top:auto; font-size:12px; letter-spacing:0.18em; text-transform:uppercase; color:#b9bdc4\">{{ d.age }}<\u002Fspan>\n        <\u002Farticle>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:20px; padding:clamp(40px,5vw,64px) clamp(18px,8vw,182px); border-bottom:1px solid rgba(255,255,255,0.08)\">\n    <sc-for list=\"{{ values }}\" as=\"v\" hint-placeholder-count=\"4\">\n      <div style=\"display:flex; flex-direction:column; gap:10px; padding:30px 26px; border:1px solid rgba(255,255,255,0.1); background:linear-gradient(180deg,#101115,#0a0a0b)\" style-hover=\"border-color:#b9bdc4\">\n        <h4 style=\"margin:0; font-family:'Oswald',sans-serif; font-size:20px; text-transform:uppercase; color:#fff\">{{ v.title }}<\u002Fh4>\n        <p style=\"margin:0; font-size:15px; line-height:1.6; color:#9ea3ab\">{{ v.text }}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fsection>\n\n  <section id=\"schedule\" style=\"padding:clamp(56px,7vw,96px) clamp(18px,8vw,182px); border-bottom:1px solid rgba(255,255,255,0.08); background:radial-gradient(800px 400px at 80% 0%, #16171b, #0a0a0b 70%)\">\n    <h2 style=\"margin:0 0 44px; font-family:'Oswald',sans-serif; font-size:clamp(34px,5vw,54px); line-height:1; text-transform:uppercase; color:#fff\">Расписание<\u002Fh2>\n    <div style=\"border:1px solid rgba(255,255,255,0.1); overflow-x:auto\"><div style=\"min-width:620px\">\n      <div style=\"display:grid; grid-template-columns:1.4fr 1fr 1fr 0.9fr; gap:20px; padding:16px 26px; background:#15161a; font-size:11px; letter-spacing:0.24em; text-transform:uppercase; color:#8d9199\">\n        <span>Направление<\u002Fspan><span>Дни<\u002Fspan><span>Время<\u002Fspan><span>Группа<\u002Fspan>\n      <\u002Fdiv>\n      <sc-for list=\"{{ schedule }}\" as=\"s\" hint-placeholder-count=\"6\">\n        <div style=\"display:grid; grid-template-columns:1.4fr 1fr 1fr 0.9fr; gap:20px; align-items:center; padding:20px 26px; border-top:1px solid rgba(255,255,255,0.08); background:#0d0e10\" style-hover=\"background:#15161a\">\n          <span style=\"font-family:'Oswald',sans-serif; font-size:19px; text-transform:uppercase; color:#fff\">{{ s.name }}<\u002Fspan>\n          <span style=\"font-size:15px; color:#b1b5bc\">{{ s.days }}<\u002Fspan>\n          <span style=\"font-size:15px; color:#b1b5bc\">{{ s.time }}<\u002Fspan>\n          <span style=\"font-size:13px; letter-spacing:0.14em; text-transform:uppercase; color:#8d9199\">{{ s.group }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv><\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"audience\" style=\"padding:clamp(56px,7vw,96px) clamp(18px,8vw,182px); border-bottom:1px solid rgba(255,255,255,0.08)\">\n    <h2 style=\"margin:0 0 12px; font-family:'Oswald',sans-serif; font-size:clamp(34px,5vw,54px); line-height:1; text-transform:uppercase; color:#fff\">Кому подходит<\u002Fh2>\n    <p style=\"margin:0 0 40px; font-size:16px; color:#9ea3ab; max-width:520px\">Группы формируем по возрасту, а не «всех вместе» — нагрузка и подача разные.<\u002Fp>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:20px\">\n      <sc-for list=\"{{ audience }}\" as=\"a\" hint-placeholder-count=\"4\">\n        <article style=\"display:flex; flex-direction:column; gap:12px; padding:30px 26px; border:1px solid rgba(255,255,255,0.1); background:linear-gradient(180deg,#101115,#0a0a0b)\" style-hover=\"border-color:#b9bdc4\">\n          <span style=\"font-family:'Oswald',sans-serif; font-size:34px; color:#fff\">{{ a.age }}<\u002Fspan>\n          <h3 style=\"margin:0; font-family:'Oswald',sans-serif; font-size:19px; letter-spacing:0.1em; text-transform:uppercase; color:#b9bdc4\">{{ a.title }}<\u002Fh3>\n          <p style=\"margin:0; font-size:15px; line-height:1.6; color:#9ea3ab\">{{ a.text }}<\u002Fp>\n        <\u002Farticle>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"prices\" style=\"padding:clamp(56px,7vw,96px) clamp(18px,8vw,182px); border-bottom:1px solid rgba(255,255,255,0.08); background:radial-gradient(700px 380px at 15% 0%, #16171b, #0a0a0b 70%)\">\n    <div style=\"display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:40px\">\n      <h2 style=\"margin:0; font-family:'Oswald',sans-serif; font-size:clamp(34px,5vw,54px); line-height:1; text-transform:uppercase; color:#fff\">Цены<\u002Fh2>\n      <p style=\"margin:0; max-width:360px; font-size:15px; line-height:1.6; color:#9ea3ab\">Первое занятие бесплатно. Абонемент действует на любое направление.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:20px\">\n      <sc-for list=\"{{ prices }}\" as=\"p\" hint-placeholder-count=\"3\">\n        <article style=\"display:flex; flex-direction:column; gap:16px; padding:34px 28px; border:1px solid rgba(255,255,255,0.12); background:#0d0e10\">\n          <span style=\"font-size:12px; letter-spacing:0.22em; text-transform:uppercase; color:#8d9199\">{{ p.tag }}<\u002Fspan>\n          <h3 style=\"margin:0; font-family:'Oswald',sans-serif; font-size:26px; text-transform:uppercase; color:#fff\">{{ p.name }}<\u002Fh3>\n          <span style=\"font-family:'Oswald',sans-serif; font-size:42px; color:#fff\">{{ p.price }}<\u002Fspan>\n          <p style=\"margin:0; font-size:15px; line-height:1.6; color:#9ea3ab\">{{ p.note }}<\u002Fp>\n          <a href=\"#contacts\" style=\"margin-top:auto; padding:14px 18px; text-align:center; font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:0.16em; text-transform:uppercase; color:#e8e8ea; border:1px solid rgba(255,255,255,0.22)\" style-hover=\"background:#e6e8ec; color:#0a0a0b; border-color:#e6e8ec\">Выбрать<\u002Fa>\n        <\u002Farticle>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"news\" style=\"padding:clamp(56px,7vw,96px) clamp(18px,8vw,182px); border-bottom:1px solid rgba(255,255,255,0.08)\">\n    <div style=\"display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:36px\">\n      <div style=\"display:flex; flex-direction:column; gap:10px\">\n        <h2 style=\"margin:0; font-family:'Oswald',sans-serif; font-size:clamp(34px,5vw,54px); line-height:1; text-transform:uppercase; color:#fff\">Новости клуба<\u002Fh2>\n        <span style=\"font-size:14px; color:#9ea3ab\">Турниры, сборы, аттестации. Лента синхронизируется с Instagram клуба.<\u002Fspan>\n      <\u002Fdiv>\n      <sc-if value=\"{{ isAdmin }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex; align-items:center; gap:10px\">\n          <button sc-camel-on-click=\"{{ toggleAdmin }}\" style=\"padding:13px 20px; cursor:pointer; border:1px solid rgba(255,255,255,0.22); background:transparent; font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:0.18em; text-transform:uppercase; color:#b9bdc4\" style-hover=\"border-color:#b9bdc4; color:#fff\">{{ adminLabel }}<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ logout }}\" style=\"padding:13px 16px; cursor:pointer; border:1px solid rgba(255,255,255,0.12); background:transparent; font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:#7e838b\" style-hover=\"color:#e8e8ea\">Выйти<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <sc-if value=\"{{ adminOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <span style=\"display:block; margin-bottom:12px; font-size:12px; color:#7e838b\">Вы вошли как администратор — новость появится на сайте сразу после публикации.<\u002Fspan>\n      <form sc-camel-on-submit=\"{{ addNews }}\" style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; align-items:end; padding:24px; margin-bottom:28px; border:1px solid rgba(255,255,255,0.14); background:#101115\">\n        <label style=\"display:flex; flex-direction:column; gap:8px; font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:#8d9199\">Дата\n          <input name=\"date\" placeholder=\"12 марта\" style=\"padding:13px 14px; background:#0a0a0b; border:1px solid rgba(255,255,255,0.16); color:#fff; font-family:'Barlow',sans-serif; font-size:15px; outline:none\" style-focus=\"border-color:#b9bdc4\">\n        <\u002Flabel>\n        <label style=\"display:flex; flex-direction:column; gap:8px; font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:#8d9199\">Заголовок\n          <input name=\"title\" placeholder=\"Турнир в Казани\" style=\"padding:13px 14px; background:#0a0a0b; border:1px solid rgba(255,255,255,0.16); color:#fff; font-family:'Barlow',sans-serif; font-size:15px; outline:none\" style-focus=\"border-color:#b9bdc4\">\n        <\u002Flabel>\n        <label style=\"display:flex; flex-direction:column; gap:8px; font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:#8d9199\">Текст\n          <input name=\"text\" placeholder=\"Кратко о событии\" style=\"padding:13px 14px; background:#0a0a0b; border:1px solid rgba(255,255,255,0.16); color:#fff; font-family:'Barlow',sans-serif; font-size:15px; outline:none\" style-focus=\"border-color:#b9bdc4\">\n        <\u002Flabel>\n        <label style=\"display:flex; flex-direction:column; gap:8px; font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:#8d9199\">Ссылка на фото\n          <input name=\"image\" placeholder=\"https://…\" style=\"padding:13px 14px; background:#0a0a0b; border:1px solid rgba(255,255,255,0.16); color:#fff; font-family:'Barlow',sans-serif; font-size:15px; outline:none\" style-focus=\"border-color:#b9bdc4\">\n        <\u002Flabel>\n        <button type=\"submit\" style=\"padding:14px 18px; border:none; cursor:pointer; font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:0.16em; text-transform:uppercase; color:#0a0a0b; background:linear-gradient(180deg,#f2f3f5,#b9bdc4)\" style-hover=\"background:#fff\">Опубликовать<\u002Fbutton>\n      <\u002Fform>\n    <\u002Fsc-if>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:20px\">\n      <sc-for list=\"{{ news }}\" as=\"n\" hint-placeholder-count=\"3\">\n        <article style=\"display:flex; flex-direction:column; border:1px solid rgba(255,255,255,0.1); background:#0d0e10\" style-hover=\"border-color:rgba(255,255,255,0.24)\">\n          <div style=\"position:relative; aspect-ratio:16/10; overflow:hidden; background:repeating-linear-gradient(135deg,#141519 0 10px,#101115 10px 20px); display:flex; align-items:center; justify-content:center\">\n            <sc-if value=\"{{ n.hasImage }}\" hint-placeholder-val=\"{{ false }}\">\n              <img src=\"{{ n.image }}\" alt=\"\" style=\"position:absolute; inset:0; width:100%; height:100%; object-fit:cover\">\n            <\u002Fsc-if>\n            <span style=\"font-family:ui-monospace,monospace; font-size:12px; color:#6f747c\">{{ n.slot }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:10px; padding:24px\">\n            <div style=\"display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:#8d9199\">\n              <span>{{ n.date }}<\u002Fspan><span>{{ n.source }}<\u002Fspan>\n            <\u002Fdiv>\n            <h3 style=\"margin:0; font-family:'Oswald',sans-serif; font-size:21px; text-transform:uppercase; color:#fff\">{{ n.title }}<\u002Fh3>\n            <p style=\"margin:0; font-size:15px; line-height:1.6; color:#9ea3ab\">{{ n.text }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Farticle>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"reviews\" style=\"padding:clamp(56px,7vw,96px) clamp(18px,8vw,182px); border-bottom:1px solid rgba(255,255,255,0.08); background:linear-gradient(180deg,#101115,#0a0a0b)\">\n    <div style=\"display:flex; flex-wrap:wrap; align-items:center; gap:28px; margin-bottom:38px\">\n      <h2 style=\"margin:0; font-family:'Oswald',sans-serif; font-size:clamp(34px,5vw,54px); line-height:1; text-transform:uppercase; color:#fff\">Отзывы<\u002Fh2>\n      <div style=\"display:flex; align-items:center; gap:12px; padding:12px 18px; border:1px solid rgba(255,255,255,0.14)\">\n        <span style=\"font-family:'Oswald',sans-serif; font-size:26px; color:#fff\">4,9<\u002Fspan>\n        <span style=\"font-size:13px; line-height:1.4; color:#9ea3ab\">рейтинг клуба<br>по отзывам родителей<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:20px\">\n      <sc-for list=\"{{ reviews }}\" as=\"r\" hint-placeholder-count=\"3\">\n        <figure style=\"display:flex; flex-direction:column; gap:16px; margin:0; padding:30px 26px; border:1px solid rgba(255,255,255,0.1); background:#0d0e10\">\n          <span style=\"letter-spacing:0.25em; color:#b9bdc4\">★★★★★<\u002Fspan>\n          <blockquote style=\"margin:0; font-size:16px; line-height:1.65; color:#d7d9dd\">{{ r.text }}<\u002Fblockquote>\n          <figcaption style=\"font-size:12px; letter-spacing:0.16em; text-transform:uppercase; color:#8d9199\">{{ r.name }}<\u002Ffigcaption>\n        <\u002Ffigure>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"gallery\" style=\"padding:clamp(56px,7vw,96px) clamp(18px,8vw,182px) clamp(40px,5vw,64px); border-bottom:1px solid rgba(255,255,255,0.08)\">\n    <h2 style=\"margin:0 0 32px; font-family:'Oswald',sans-serif; font-size:clamp(34px,5vw,54px); line-height:1; text-transform:uppercase; color:#fff\">Зал и тренировки<\u002Fh2>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px\">\n      <sc-for list=\"{{ gallery }}\" as=\"g\" hint-placeholder-count=\"6\">\n        <div style=\"aspect-ratio:4/3; border:1px solid rgba(255,255,255,0.1); background:repeating-linear-gradient(135deg,#141519 0 10px,#101115 10px 20px); display:flex; align-items:center; justify-content:center; padding:10px; text-align:center\">\n          <span style=\"font-family:ui-monospace,monospace; font-size:12px; color:#6f747c\">{  style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:0; border-bottom:1px solid rgba(255,255,255,0.08)\">\n    <div style=\"display:flex; flex-direction:column; gap:26px; padding:clamp(52px,7vw,88px) clamp(18px,8vw,182px); background:linear-gradient(180deg,#15161a,#0a0a0b)\">\n      <h2 style=\"margin:0; font-family:'Oswald',sans-serif; font-size:52px; line-height:1.02; text-transform:uppercase; color:#fff\">Первое занятие<br>бесплатно<\u002Fh2>\n      <p style=\"margin:0; font-size:17px; line-height:1.6; color:#b1b5bc; max-width:460px\">Оставьте номер — подберём группу по возрасту и направлению, расскажем про экипировку и расписание.<\u002Fp>\n      <form sc-camel-on-submit=\"{{ onSubmit }}\" style=\"display:flex; flex-direction:column; gap:14px; max-width:440px\">\n        <input name=\"name\" required=\"\" placeholder=\"Имя\" style=\"padding:16px 18px; background:#0d0e10; border:1px solid rgba(255,255,255,0.16); color:#fff; font-family:'Barlow',sans-serif; font-size:16px; outline:none\" style-focus=\"border-color:#b9bdc4\">\n        <input name=\"phone\" type=\"tel\" required=\"\" placeholder=\"Телефон\" style=\"padding:16px 18px; background:#0d0e10; border:1px solid rgba(255,255,255,0.16); color:#fff; font-family:'Barlow',sans-serif; font-size:16px; outline:none\" style-focus=\"border-color:#b9bdc4\">\n        <input name=\"company\" tabindex=\"-1\" autocomplete=\"off\" aria-hidden=\"true\" style=\"position:absolute; left:-9999px; width:1px; height:1px; opacity:0\">\n        <label style=\"display:flex; align-items:flex-start; gap:12px; font-size:13px; line-height:1.55; color:#9ea3ab; cursor:pointer\">\n          <input type=\"checkbox\" required=\"\" checked=\"{{ consent }}\" sc-camel-on-change=\"{{ onConsent }}\" style=\"width:18px; height:18px; margin-top:2px; accent-color:#b9bdc4; flex:none\">\n          <span>Я даю согласие на обработку моих персональных данных (имя, телефон) в соответствии с <a href=\"#privacy\" style=\"color:#e8e8ea; text-decoration:underline\">Политикой обработки персональных данных<\u002Fa> и Федеральным законом № 152-ФЗ.<\u002Fspan>\n        <\u002Flabel>\n        <button type=\"submit\" disabled=\"{{ submitDisabled }}\" style=\"padding:17px 20px; border:none; cursor:pointer; font-family:'Oswald',sans-serif; font-size:15px; letter-spacing:0.16em; text-transform:uppercase; color:#0a0a0b; background:linear-gradient(180deg,#f2f3f5,#b9bdc4)\" style-hover=\"background:#fff\">{{ submitLabel }}<\u002Fbutton>\n        <span style=\"font-size:12px; line-height:1.5; color:#7e838b\">{{ formHint }}<\u002Fspan>\n        <sc-if value=\"{{ errorText }}\" hint-placeholder-val=\"{{ false }}\">\n          <span style=\"font-size:13px; line-height:1.5; color:#e6b7b7\">{{ errorText }}<\u002Fspan>\n        <\u002Fsc-if>\n      <\u002Fform>\n    <\u002Fdiv>\n    <div style=\"display:flex; flex-direction:column; justify-content:center; gap:28px; padding:clamp(52px,7vw,88px) clamp(18px,8vw,182px); border-left:1px solid rgba(255,255,255,0.08)\">\n      <div style=\"display:flex; flex-direction:column; gap:6px\">\n        <span style=\"font-size:11px; letter-spacing:0.28em; text-transform:uppercase; color:#8d9199\">Адрес<\u002Fspan>\n        <span style=\"font-family:'Oswald',sans-serif; font-size:30px; text-transform:uppercase; color:#fff\">ТЦ «Омега»<\u002Fspan>\n        <span style=\"font-size:16px; color:#b1b5bc\">Набережные Челны<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:6px\">\n        <span style=\"font-size:11px; letter-spacing:0.28em; text-transform:uppercase; color:#8d9199\">Часы работы<\u002Fspan>\n        <span style=\"font-size:17px; color:#e8e8ea\">Пн–Сб 09:00–21:30 · Вс 10:00–16:00<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:6px\">\n        <span style=\"font-size:11px; letter-spacing:0.28em; text-transform:uppercase; color:#8d9199\">Связь<\u002Fspan>\n        <a href=\"tel:+70000000000\" style=\"font-family:'Oswald',sans-serif; font-size:26px; color:#fff\">+7 (000) 000-00-00<\u002Fa>\n        <span style=\"font-size:15px; color:#9ea3ab\">Телеграм и WhatsApp — по тому же номеру<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"height:200px; border:1px solid rgba(255,255,255,0.1); background:repeating-linear-gradient(135deg,#141519 0 10px,#101115 10px 20px); display:flex; align-items:center; justify-content:center\">\n        <span style=\"font-family:ui-monospace,monospace; font-size:12px; color:#6f747c\">карта / схема проезда<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"privacy\" style=\"padding:clamp(52px,6vw,80px) clamp(18px,8vw,182px); border-bottom:1px solid rgba(255,255,255,0.08); background:#0d0e10\">\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:36px; max-width:1200px\">\n      <div style=\"display:flex; flex-direction:column; gap:14px\">\n        <h2 style=\"margin:0; font-family:'Oswald',sans-serif; font-size:clamp(26px,3.4vw,36px); line-height:1.05; text-transform:uppercase; color:#fff\">Политика обработки персональных данных<\u002Fh2>\n        <p style=\"margin:0; font-size:14px; line-height:1.65; color:#9ea3ab\">Оператор обрабатывает персональные данные в соответствии с Федеральным законом от 27.07.2006 № 152-ФЗ «О персональных данных». Данные хранятся и обрабатываются на территории Российской Федерации.<\u002Fp>\n        <p style=\"margin:0; font-size:14px; line-height:1.65; color:#9ea3ab\">Цель обработки: запись на пробное занятие и связь с посетителем. Состав данных: имя, номер телефона. Основание: согласие субъекта. Срок: до отзыва согласия или достижения цели. Данные не передаются третьим лицам, кроме случаев, предусмотренных законом.<\u002Fp>\n        <p style=\"margin:0; font-size:14px; line-height:1.65; color:#9ea3ab\">Отзыв согласия и запрос на удаление данных — письменно на e-mail оператора или по адресу клуба. Сайт использует cookie-файлы для работы и статистики.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:14px\">\n        <h3 style=\"margin:0; font-family:'Oswald',sans-serif; font-size:20px; letter-spacing:0.1em; text-transform:uppercase; color:#b9bdc4\">Сведения об операторе<\u002Fh3>\n        <div style=\"display:grid; grid-template-columns:max-content 1fr; gap:10px 20px; font-size:14px; line-height:1.5; color:#9ea3ab\">\n          <span style=\"color:#6f747c\">Оператор<\u002Fspan><span>ИП Антипов И. И.<\u002Fspan>\n          <span style=\"color:#6f747c\">ИНН<\u002Fspan><span>000000000000<\u002Fspan>\n          <span style=\"color:#6f747c\">ОГРНИП<\u002Fspan><span>000000000000000<\u002Fspan>\n          <span style=\"color:#6f747c\">Адрес<\u002Fspan><span>г. Набережные Челны, ТЦ «Омега»<\u002Fspan>\n          <span style=\"color:#6f747c\">E-mail<\u002Fspan><span>info@antipovteam.ru<\u002Fspan>\n          <span style=\"color:#6f747c\">Телефон<\u002Fspan><span>+7 (000) 000-00-00<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0; font-size:13px; line-height:1.6; color:#7e838b\">Информация на сайте не является публичной офертой (ст. 437 ГК РФ). Услуги оказываются на основании договора; занятия проводятся при наличии допуска по состоянию здоровья.<\u002Fp>\n        <p style=\"margin:0; font-size:13px; line-height:1.6; color:#7e838b\">Реквизиты, ИНН/ОГРНИП и e-mail — заглушки, замените на реальные перед публикацией.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:18px 24px; padding:30px clamp(18px,8vw,182px); font-size:12px; letter-spacing:0.12em; text-transform:uppercase; color:#6f747c\">\n    <div style=\"display:flex; align-items:center; gap:12px\">\n      <img src=\"b70011d4-4c95-46ff-8555-765bed8ad1b9\" alt=\"\" style=\"width:30px; height:30px; object-fit:contain\">\n      <span>Antipov Team · Единоборства · Челны<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex; flex-wrap:wrap; align-items:center; gap:12px 22px\">\n      <button sc-camel-on-click=\"{{ openLogin }}\" style=\"padding:0; border:none; background:none; cursor:pointer; font-family:'Barlow',sans-serif; font-size:12px; letter-spacing:0.12em; text-transform:uppercase; color:#6f747c\" style-hover=\"color:#e8e8ea\">Вход для админа<\u002Fbutton>\n      <a href=\"#privacy\">Политика конфиденциальности<\u002Fa>\n      <a href=\"#privacy\">Согласие на обработку данных<\u002Fa>\n      <span>18+ и детские группы с 3,5 лет<\u002Fspan>\n      <span>© 2026 ИП Антипов И. И.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n  <sc-if value=\"{{ loginOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(6,6,8,0.72); backdrop-filter:blur(6px)\">\n      <form sc-camel-on-submit=\"{{ doLogin }}\" style=\"display:flex; flex-direction:column; gap:14px; width:100%; max-width:380px; padding:30px; border:1px solid rgba(255,255,255,0.14); background:#101115\">\n        <h3 style=\"margin:0; font-family:'Oswald',sans-serif; font-size:22px; letter-spacing:0.1em; text-transform:uppercase; color:#fff\">Вход для админа<\u002Fh3>\n        <p style=\"margin:0; font-size:13px; line-height:1.55; color:#8d9199\">Введите пароль администратора. Он проверяется на сервере и не сохраняется после закрытия вкладки.<\u002Fp>\n        <input name=\"token\" type=\"password\" autocomplete=\"current-password\" placeholder=\"Пароль\" style=\"padding:14px 16px; background:#0a0a0b; border:1px solid rgba(255,255,255,0.16); color:#fff; font-family:'Barlow',sans-serif; font-size:16px; outline:none\" style-focus=\"border-color:#b9bdc4\">\n        <sc-if value=\"{{ loginError }}\" hint-placeholder-val=\"{{ false }}\">\n          <span style=\"font-size:13px; color:#e6b7b7\">{{ loginError }}<\u002Fspan>\n        <\u002Fsc-i s.setState({ news: JSON.parse(raw) });\n      if (localStorage.getItem(\"antipov_cookie_ok\")) this.setState({ cookieOk: true });\n    } catch (e) {}\n    try {\n      const t = sessionStorage.getItem(\"antipov_admin\");\n      if (t) {\n        fetch(this.api() + \"/api/admin/check\", { headers: { Authorization: \"Bearer \" + t } })\n          .then(r => { if (r.ok) this.setState({ isAdmin: true }); })\n          .catch(() => {});\n      }\n    } catch (e) {}\n    fetch(this.api() + \"/api/news\")\n      .then(r => r.json())\n      .then(d => {\n        if (d && d.ok && Array.isArray(d.items) && d.items.length) this.setState({ news: d.items });\n      })\n      .catch(() => {});\n    this.syncScrollOffset();\n    window.addEventListener(\"resize\", this.syncScrollOffset);\n    document.addEventListener(\"click\", this.onAnchorClick);\n    window.addEventListener(\"scroll\", this.onScroll, { passive: true });\n    this.onScroll();\n  }\n  componentWillUnmount() {\n    window.removeEventListener(\"resize\", this.syncScrollOffset);\n    document.removeEventListener(\"click\", this.onAnchorClick);\n    window.removeEventListener(\"scroll\", this.onScroll);\n  }\n  onScroll = () => {\n    const show = window.scrollY > 600;\n    if (show !== this.state.showTop) this.setState({ showTop: show });\n  };\n  api() {\n    return (this.props.apiBase ?? \"\").replace(/\\/$/, \"\");\n  }\n  syncScrollOffset = () => {\n    const h = document.querySelector(\"header\");\n    if (!h) return;\n    document.documentElement.style.scrollPaddingTop = \"0px\";\n  };\n  onAnchorClick = (e) => {\n    const a = e.target.closest && e.target.closest('a[href^=\"#\"]');\n    if (!a) return;\n    const id = a.getAttribute(\"href\").slice(1);\n    const el = id && document.getElementById(id);\n    if (!el) return;\n    e.preventDefault();\n    const top = el.getBoundingClientRect().top + window.scrollY;\n    window.scrollTo({ top: Math.max(top, 0), behavior: \"smooth\" });\n    history.replaceState(null, \"\", \"#\" + id);\n  };\n  saveNews(list) {\n    this.setState({ news: list });\n    try { localStorage.setItem(\"antipov_news\", JSON.stringify(list)); } catch (e) {}\n  }\n  renderVals() {\n    const news = (this.state.news || this.defaultNews).map(n => ({\n      ...n,\n      image: n.image || \"\",\n      hasImage: !!n.image\n    }));\n    return {\n      news,\n      isAdmin: !!this.state.isAdmin,\n      loginOpen: !!this.state.loginOpen,\n      loginError: this.state.loginError || \"\",\n      openLogin: () => this.setState(s => ({ loginOpen: !s.loginOpen, loginError: \"\" })),\n      doLogin: (e) => {\n        e.preventDefault();\n        const token = e.target.elements.token.value.trim();\n        if (!token) return;\n        fetch(this.api() + \"/api/admin/check\", { headers: { Authorization: \"Bearer \" + token } })\n          .then(r => r.json().catch(() => ({ ok: r.ok })))\n          .then(d => {\n            if (!d.ok) throw new Error();\n            try { sessionStorage.setItem(\"antipov_admin\", token); } catch (err) {}\n            this.setState({ isAdmin: true, loginOpen: false, loginError: \"\" });\n          })\n          .catch(() => this.setState({ loginError: \"Неверный пароль\" }));\n      },\n      logout: () => {\n        try { sessionStorage.removeItem(\"antipov_admin\"); } catch (err) {}\n        this.setState({ isAdmin: false, adminOpen: false });\n      },\n      adminOpen: this.state.adminOpen,\n      adminLabel: this.state.adminOpen ? \"Закрыть форму\" : \"Добавить новость\",\n      toggleAdmin: () => this.setState(s => ({ adminOpen: !s.adminOpen })),\n      addNews: (e) => {\n        e.preventDefault();\n        const f = e.target;\n        let token = \"\";\n        try { token = sessionStorage.getItem(\"antipov_admin\") || \"\"; } catch (err) {}\n        const item = {\n          date: f.date.value || new Date().toLocaleDateString(\"ru-RU\"),\n          title: f.title.value || \"Без заголовка\",\n          text: f.text.value || \"\",\n          image: f.image ? f.image.value : \"\"\n        };\n        fetch(this.api() + \"/api/news\", {\n          method: \"POST\",\n          headers: { \"Content-Type\": \"application/json\", Authorization: \"Bearer \" + token },\n          body: JSON.stringify(item)\n        })\n          .then(r => r.json().catch(() => ({ ok: r.ok })))\n          .then(d => {\n            if (!d.ok) throw new Error();\n            this.setState({ news: [{ ...item, source: \"Клуб\", slot: \"фото новости\" }, ...news], adminOpen: false });\n            f.reset();\n          })\n          .catch(() => this.setState({ loginError: \"Не удалось опубликовать — войдите заново.\", isAdmin: false }));\n      },\n      audience: [\n        { age: \"3,5–6\", title: \"Малыши\", text: \"Игровая ОФП, координация, первые борцовские движения без спаррингов.\" },\n        { age: \"7–11\", title: \"Дети\", text: \"Техника борьбы и ударки, дисциплина, первые старты по желанию.\" },\n        { age: \"12–17\", title: \"Подростки\", text: \"Полноценные тренировки, спарринги по уровню, соревновательная группа.\" },\n        { age: \"18+\", title: \"Взрослые\", text: \"Для формы и для себя — от нуля до соревнований, без возрастных рамок.\" }\n      ],\n      prices: [\n        { tag: \"Знакомство\", name: \"Разовое\", price: \"500 ₽\", note: \"Одна тренировка на любом направлении. Первая — бесплатно.\" },\n        { tag: \"Оптимально\", name: \"8 занятий\", price: \"3 200 ₽\", note: \"Действует месяц, можно комбинировать направления.\" },\n        { tag: \"Максимум\", name: \"Безлимит\", price: \"4 500 ₽\", note: \"Все группы по возрасту и уровню, без ограничений по числу тренировок.\" }\n      ],\n      reviews: [\n        { text: \"Сын ходит с четырёх лет. Стал собраннее, сам просит на тренировку. Тренер держит дисциплину без крика.\", name: \"Айгуль, мама воспитанника\" },\n        { text: \"Пришёл в 34 года с нуля на бокс. Через полгода спарринги и минус 9 кг. Никто не смотрит на тебя ко aBar ?? \"Плавающие кнопки\") === \"Плашка-пилюля\",\n      barIsBar: (this.props.ctaBar ?? \"Плавающие кнопки\") === \"Полная панель\",\n      barIsFab: (this.props.ctaBar ?? \"Плавающие кнопки\") === \"Плавающие кнопки\",\n      showTop: !!this.state.showTop,\n      scrollTop: () => window.scrollTo({ top: 0, behavior: \"smooth\" }),\n      cookieOpen: !this.state.cookieOk,\n      acceptCookies: () => {\n        this.setState({ cookieOk: true });\n        try { localStorage.setItem(\"antipov_cookie_ok\", \"1\"); } catch (err) {}\n      },\n      directions: [\n        { num: \"01\", title: \"Вольная борьба\", text: \"База единоборств: стойка, борьба в партере, работа с сопротивлением.\", age: \"с 3,5 лет\" },\n        { num: \"02\", title: \"Джиу-джитсу\", text: \"Контроль, позиции и болевые. Техника вместо силы.\", age: \"с 6 лет\" },\n        { num: \"03\", title: \"ММА\", text: \"Соединяем борьбу и удары в одну систему боя.\", age: \"с 12 лет\" },\n        { num: \"04\", title: \"Бокс\", text: \"Постановка удара, работа на снарядах, спарринги по уровню.\", age: \"с 7 лет\" },\n        { num: \"05\", title: \"Кикбоксинг\", text: \"Удары руками и ногами, скорость, дыхание, выносливость.\", age: \"с 8 лет\" },\n        { num: \"06\", title: \"Боевое самбо\", text: \"Прикладная дисциплина: броски, удары, самозащита.\", age: \"с 12 лет\" }\n      ],\n      values: [\n        { title: \"Дети с 3,5 лет\", text: \"Игровая ОФП и мягкое вхождение в борьбу без перегрузок.\" },\n        { title: \"Дисциплина\", text: \"Режим, уважение к партнёру и привычка доводить дело до конца.\" },\n        { title: \"Свой зал\", text: \"Ковёр, ринг, снаряды и раздевалки в ТЦ «Омега».\" },\n        { title: \"Соревнования\", text: \"Регулярные выезды и подготовка к турнирам для тех, кто хочет расти.\" }\n      ],\n      schedule: [\n        { name: \"Вольная борьба\", days: \"Пн · Ср · Пт\", time: \"17:00–18:30\", group: \"Дети\" },\n        { name: \"Вольная борьба\", days: \"Пн · Ср ·
