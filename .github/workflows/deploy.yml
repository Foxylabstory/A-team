name: Deploy Antipov Team

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: antipov-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://antipov.team
    defaults:
      run:
        working-directory: A-Team/server
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: A-Team/server/package-lock.json

      - name: Test the release
        run: |
          npm ci
          npm test

      - name: Package the site
        run: |
          npm ci --omit=dev
          tar -czf "$RUNNER_TEMP/antipov-release.tar.gz" \
            package.json package-lock.json server.js lib public node_modules \
            scripts/manage.js scripts/refresh-reviews.js \
            instagram-loader/{images,instagram,instaloader,video}.js

      - name: Deploy the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          master_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')
          if [[ "$master_sha" != "$GITHUB_SHA" ]]; then
            echo "A newer master commit is available. Skipping this deployment."
            exit 0
          fi
          : "${VPS_HOST:?Set VPS_HOST in the production environment}"
          : "${VPS_SSH_KEY:?Set VPS_SSH_KEY in the production environment}"
          : "${VPS_KNOWN_HOSTS:?Set VPS_KNOWN_HOSTS in the production environment}"

          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh -T -i "$ssh_dir/key" -l antipov-deploy \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -- "$VPS_HOST" "$GITHUB_SHA" < "$RUNNER_TEMP/antipov-release.tar.gz"
